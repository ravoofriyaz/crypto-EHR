<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 5: Performance Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: white; margin: 20px; }
        .charts-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; }
        .chart-wrapper { width: 45%; min-width: 300px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); background-color: #fff; }
        .chart-wrapper.full { width: 90%; }
        h2 { text-align: center; width: 100%; margin-bottom: 30px; }
    </style>
</head>
<body>
    <h2>Figure 5: Performance Comparison (500 KB Dataset)</h2>
    <div class="charts-container">
        
        <!-- Chart 1: Key Generation -->
        <div class="chart-wrapper full">
            <canvas id="keyGenChart"></canvas>
        </div>

        <!-- Chart 2: Encryption Speed -->
        <div class="chart-wrapper">
            <canvas id="encSpeedChart"></canvas>
        </div>

        <!-- Chart 3: Memory Usage -->
        <div class="chart-wrapper">
            <canvas id="memoryChart"></canvas>
        </div>

    </div>

    <script>
        // Common colors
        const colorRSA = 'rgba(54, 162, 235, 0.7)'; // Blue for Legacy
        const colorECC = 'rgba(75, 192, 192, 0.7)'; // Green for Proposed
        const borderRSA = 'rgb(54, 162, 235)';
        const borderECC = 'rgb(75, 192, 192)';

        // 1. Key Generation Chart
        new Chart(document.getElementById('keyGenChart'), {
            type: 'bar',
            data: {
                labels: ['Algorithm'],
                datasets: [
                    {
                        label: 'AES-RSA (Legacy RSA-based)',
                        data: [1240.28],
                        backgroundColor: colorRSA,
                        borderColor: borderRSA,
                        borderWidth: 1
                    },
                    {
                        label: 'Proposed Bio-ECC-AES',
                        data: [5.16],
                        backgroundColor: colorECC,
                        borderColor: borderECC,
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { title: { display: true, text: 'Key Generation Time Comparison' } },
                scales: { y: { beginAtZero: true, title: { display: true, text: 'Time (ms)' } } },
                animation: false
            }
        });

        // 2. Encryption Speed Chart
        new Chart(document.getElementById('encSpeedChart'), {
            type: 'bar',
            data: {
                labels: ['Algorithm'],
                datasets: [
                    {
                        label: 'AES-CBC + SHA-256',
                        data: [12.89],
                        backgroundColor: colorRSA,
                        borderColor: borderRSA,
                        borderWidth: 1
                    },
                    {
                        label: 'AES-GCM',
                        data: [10.79],
                        backgroundColor: colorECC,
                        borderColor: borderECC,
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { title: { display: true, text: 'Encryption Speed Comparison' } },
                scales: { y: { beginAtZero: true, title: { display: true, text: 'Time (ms)' } } },
                animation: false
            }
        });

        // 3. Memory Usage Chart
        new Chart(document.getElementById('memoryChart'), {
            type: 'bar',
            data: {
                labels: ['Cryptographic Framework'],
                datasets: [
                    {
                        label: 'AES-RSA',
                        data: [524],
                        backgroundColor: colorRSA,
                        borderColor: borderRSA,
                        borderWidth: 1
                    },
                    {
                        label: 'Bio-ECC-AES',
                        data: [539],
                        backgroundColor: colorECC,
                        borderColor: borderECC,
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { title: { display: true, text: 'Memory Usage Comparison' } },
                scales: { 
                    y: { 
                        beginAtZero: false, 
                        min: 300,
                        max: 600,
                        title: { display: true, text: 'Memory Usage (KB)' } 
                    } 
                },
                animation: false
            }
        });
    </script>
</body>
</html>
