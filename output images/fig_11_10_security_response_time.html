<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 11.10: Security Response Time</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f6f9;
            margin: 0;
        }

        .chart-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 800px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <h2>Security Response Time Comparison</h2>
        <p class="subtitle">Fig 11.10: Autonomous Auditing Engine vs. Manual IT Monitoring</p>
        <canvas id="responseTimeChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('responseTimeChart').getContext('2d');
        const responseTimeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['0 min (Event)', '1 min', '2 min', '5 min', '15 min', '30 min', '60+ min'],
                datasets: [
                    {
                        label: 'Cryptography-EHR (Autonomous Audit Engine)',
                        data: [0, 95, 100, 100, 100, 100, 100],
                        borderColor: '#2ecc71',
                        backgroundColor: 'rgba(46, 204, 113, 0.15)',
                        borderWidth: 4,
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: '#2ecc71',
                        pointRadius: 6,
                        pointHoverRadius: 8
                    },
                    {
                        label: 'Standard Systems (Manual IT Monitoring)',
                        data: [0, 0, 0, 10, 30, 75, 100],
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.05)',
                        borderWidth: 3,
                        borderDash: [5, 5],
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#e74c3c',
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14,
                                family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
                            },
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.dataset.label + ': ' + context.raw + '% Mitigation Complete';
                            }
                        },
                        titleFont: { size: 15 },
                        bodyFont: { size: 14 },
                        padding: 12
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Time Since Unauthorized Access Attempt',
                            font: { size: 15, weight: 'bold' }
                        },
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Mitigation Completion (%)',
                            font: { size: 15, weight: 'bold' }
                        },
                        min: 0,
                        max: 110,
                        ticks: {
                            stepSize: 20
                        }
                    }
                }
            }
        });
    </script>
</body>

</html>
