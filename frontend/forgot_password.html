<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SecureEHR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="full-screen">
        <div class="container flex-center">
            
            <div class="auth-container" style="width: 500px; min-height: 400px; padding: 40px; display: flex; flex-direction: column; justify-content: center;">
                
                <!-- STEP 1: Request OTP -->
                <div id="step-request-otp">
                    <h2 style="margin-bottom: 10px; color: var(--text-dark); text-align: center;">Forgot Password</h2>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Enter your User ID and registered mobile number.</p>
                    
                    <div style="margin-bottom: 15px;">
                        <input type="text" id="userId" placeholder="Enter your User ID (e.g., P-1234 or D-5678)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #eee;">
                    </div>

                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <select id="countryCode" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; background:#eee; width: 30%;">
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                        </select>
                        <input type="text" id="mobileNumber" placeholder="Phone Number" style="flex:1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #eee;">
                    </div>
                    
                    <button class="btn btn-primary" style="width: 100%; border-radius: 8px;" onclick="sendOTP()">Send OTP</button>
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="auth.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Back to Login</a>
                    </div>
                </div>

                <!-- STEP 2: Verify OTP -->
                <div id="step-verify-otp" style="display: none;">
                    <h2 style="margin-bottom: 10px; color: var(--text-dark); text-align: center;">Verify OTP</h2>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Enter the 6-digit code sent to your mobile.</p>
                    
                    <input type="text" id="otpCode" placeholder="Enter OTP" style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; background: #eee; text-align: center; letter-spacing: 4px; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px;">
                    
                    <button class="btn btn-secondary" style="width: 100%; border-radius: 8px;" onclick="verifyOTP()">Verify Code</button>
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="#" onclick="showStep('step-request-otp')" style="color: var(--primary-color); text-decoration: none; font-size: 0.85rem;">Change Mobile Number</a>
                    </div>
                </div>

                <!-- STEP 3: Reset Password -->
                <div id="step-reset-password" style="display: none;">
                    <h2 style="margin-bottom: 10px; color: var(--text-dark); text-align: center;">Create New Password</h2>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Your new password must be securely hashed.</p>
                    
                    <input type="password" id="newPassword" placeholder="New Password" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #eee; margin-bottom: 15px;">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #eee; margin-bottom: 20px;">
                    
                    <button class="btn btn-primary" style="width: 100%; border-radius: 8px; background-color: var(--secondary-color);" onclick="resetPassword()">Reset Password</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" style="position: fixed; top: 20px; right: 20px; z-index: 999; padding: 15px 20px; border-radius: 5px; color: white; display: none;"></div>

    <script>
        const API_URL = "http://localhost:3000";
        let userPhone = "";
        let finalUserId = "";

        function showNotification(message, type="error") {
            const notif = document.getElementById('notification');
            notif.innerText = message;
            notif.style.background = type === "success" ? "#2ecc71" : "#e74c3c";
            notif.style.display = "block";
            setTimeout(() => { notif.style.display = "none"; }, 4000);
        }

        function showStep(stepId) {
            document.getElementById('step-request-otp').style.display = 'none';
            document.getElementById('step-verify-otp').style.display = 'none';
            document.getElementById('step-reset-password').style.display = 'none';
            document.getElementById(stepId).style.display = 'block';
        }

        async function sendOTP() {
            const uid = document.getElementById('userId').value.trim();
            const code = document.getElementById('countryCode').value;
            const num = document.getElementById('mobileNumber').value;
            
            if(!uid) { showNotification("Please enter your User ID"); return; }
            if(!num) { showNotification("Please enter mobile number"); return; }
            
            userPhone = code + num;
            finalUserId = uid;

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: finalUserId, phone: userPhone })
                });
                const data = await res.json();
                if(data.success) {
                    showNotification(data.message, "success");
                    showStep('step-verify-otp');
                } else {
                    showNotification(data.message);
                }
            } catch(e) {
                showNotification("Server error or offline.");
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otpCode').value;
            if(!otp) { showNotification("Please enter OTP"); return; }
            
            try {
                const res = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: userPhone, otp: otp })
                });
                const data = await res.json();
                if(data.success) {
                    showNotification(data.message, "success");
                    showStep('step-reset-password');
                } else {
                    showNotification(data.message);
                }
            } catch(e) {
                showNotification("Server error.");
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if(!newPassword || newPassword.length < 5) { 
                showNotification("Password must be at least 5 characters."); 
                return; 
            }
            if(newPassword !== confirm) { 
                showNotification("Passwords do not match."); 
                return; 
            }

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: finalUserId, phone: userPhone, newPassword: newPassword })
                });
                const data = await res.json();
                
                if(data.success) {
                    showNotification("Password reset successful! Redirecting to login...", "success");
                    setTimeout(() => { window.location.href = "auth.html"; }, 2000);
                } else {
                    showNotification(data.message);
                }
            } catch(e) {
                showNotification("Server error.");
            }
        }
    </script>
</body>
</html>
